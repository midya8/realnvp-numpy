[project]
name = "realnvp-numpy"
version = "0.1.0"
description = "A RealNVP normalizing flow in NumPy with hand-written backprop"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
